# kite relay behind nginx TLS termination.
#
# kite-relay listens on 127.0.0.1:8080 and speaks plain WebSocket.
# Replace tunnel.example.com. Point ssl_certificate at files that stay on the
# server; do not commit certificates or private keys.
#
# Application ping/pong frames (type 10 / 11, every 20s) keep the upgraded
# connection alive through this proxy. proxy_read_timeout must be longer than
# the idle gap you expect; 24h is a safe default, with the app heartbeat
# refreshing the connection long before that.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream kite_relay {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    server_name tunnel.example.com;

    # ssl_certificate     /etc/ssl/certs/tunnel.example.com.fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/tunnel.example.com.key;

    location / {
        proxy_pass http://kite_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
